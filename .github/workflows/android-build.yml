name: Build MySavings APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Check Android project
        run: |
          echo "Checking Android project..."
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Android project files found."
          
